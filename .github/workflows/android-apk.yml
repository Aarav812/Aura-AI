name: Build Android APK
# Runs on every push and can also be started manually
# (Actions tab -> "Build Android APK" -> "Run workflow").
on:
  push:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
      # gradlew/gradlew.bat/gradle-wrapper.jar are intentionally NOT committed
      # to this repo. GitHub runners ship with Gradle, so we regenerate the
      # wrapper (pinned to Gradle 8.9, as in gradle-wrapper.properties) and
      # then use ./gradlew for a reproducible build.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      # Optional: inject real API keys via GitHub repo Secrets.
      # The app builds fine without them (keys default to empty strings);
      # add them under Settings -> Secrets and variables -> Actions if you
      # want the APK to actually call the NVIDIA API / Google Sign-In.
      - name: Write secrets to local.properties
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          {
            echo "NVIDIA_API_KEY=${NVIDIA_API_KEY}"
            echo "NVIDIA_BASE_URL=https://integrate.api.nvidia.com/"
            echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}"
          } > local.properties
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
