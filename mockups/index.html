<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura AI — UI Mockups</title>
<style>
  :root { --grad: linear-gradient(135deg,#8B5CF6,#6366F1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F3F0FF; color: #1C1636; padding: 40px 24px 80px;
  }
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    width: 64px; height: 64px; border-radius: 18px; background: var(--grad);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff; margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(124,92,252,.35);
  }
  h1 { font-size: 34px; letter-spacing: -.5px; }
  .sub { color: #6b6486; margin-top: 6px; font-size: 15px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px; max-width: 1200px; margin: 0 auto;
  }
  figure {
    background: rgba(255,255,255,.75); border-radius: 26px; padding: 14px;
    box-shadow: 0 10px 30px rgba(124,92,252,.12); transition: transform .2s ease, box-shadow .2s ease;
  }
  figure:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(124,92,252,.22); }
  figure img { width: 100%; border-radius: 16px; display: block; }
  figcaption { text-align: center; padding: 12px 4px 4px; font-weight: 600; font-size: 15px; }
  .tag { display:inline-block; font-size:11px; font-weight:600; color:#7C5CFC;
    background:#EDE7FF; padding:3px 10px; border-radius:50px; margin-top:6px; }
</style>
</head>
<body>
  <header>
    <div class="logo">✦</div>
    <h1>Aura AI</h1>
    <p class="sub">UI Mockups · Premium Apple-inspired design · Material 3</p>
  </header>
  <div class="grid">
    <figure><img src="01_auth.png" alt="Auth"><figcaption>Authentication<br><span class="tag">Sign in · Google · Guest</span></figcaption></figure>
    <figure><img src="02_home.png" alt="Home"><figcaption>Home<br><span class="tag">Greeting · Quick actions · Chats</span></figcaption></figure>
    <figure><img src="03_chat.png" alt="Chat"><figcaption>Chat<br><span class="tag">Markdown · Code · Streaming</span></figcaption></figure>
    <figure><img src="04_explore.png" alt="Explore"><figcaption>Explore<br><span class="tag">Prompts · Trending</span></figcaption></figure>
    <figure><img src="05_library.png" alt="Library"><figcaption>Library<br><span class="tag">Grid · Filters</span></figcaption></figure>
    <figure><img src="06_settings.png" alt="Settings"><figcaption>Settings<br><span class="tag">AI prefs · Theme</span></figcaption></figure>
    <figure><img src="07_search.png" alt="Search"><figcaption>Global Search<br><span class="tag">Chats · Messages</span></figcaption></figure>
    <figure><img src="08_profile.png" alt="Profile"><figcaption>Profile<br><span class="tag">Account · Plan</span></figcaption></figure>
    <figure><img src="09_voice.png" alt="Voice"><figcaption>Voice Mode<br><span class="tag">Waveform · Glow</span></figcaption></figure>
    <figure><img src="10_chat_dark.png" alt="Chat Dark"><figcaption>Chat — Dark Mode<br><span class="tag">Reasoning · LaTeX</span></figcaption></figure>
  </div>
</body>
</html>
